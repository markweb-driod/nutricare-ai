version: '3.8'

services:
  # 1. Nginx Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: nutricare-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # 2. Next.js 14 Responsive PWA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: nutricare-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 3. Laravel / PHP 8.2 Modular Monolith Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: nutricare-backend
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nutricare_db
      - DB_USERNAME=nutricare_admin
      - DB_PASSWORD=secure_nutricare_pwd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis
      - ml-service
    restart: unless-stopped

  # 4. FastAPI Python ML Microservice (Random Forest Inference)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../infrastructure/docker/ml-service.Dockerfile
    container_name: nutricare-ml-service
    environment:
      - MODEL_PATH=/app/models/meal_suitability_rf.joblib
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 5. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: nutricare-postgres
    environment:
      POSTGRES_DB: nutricare_db
      POSTGRES_USER: nutricare_admin
      POSTGRES_PASSWORD: secure_nutricare_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 6. Redis 7.2 Cache & Queue Broker
  redis:
    image: redis:7.2-alpine
    container_name: nutricare-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
